---
ELDER:
- Приветствую. В ратуше считаем запасы, а не обещания.
- Каждый новый дом должен быть обеспечен едой.
- Помощь деревне мы помним по делам.
- 'Загляните в управление: там видно, что нам мешает.'
MERCHANT:
- Покупаю то, что нам действительно нужно.
- Казна конечна. Проверим цену перед обменом.
- Резерв для ужина в продажу не идёт.
- Сдачу отсчитываю до последней бронзовой.
BUILDER:
- Сначала основание, потом стены и крыша.
- Отмеченный участок нельзя менять до конца работ.
- Материалы вашего дома лежат отдельно.
- Если работа встала, причина записана в проекте.
FARMER:
- У политой грядки есть завтрашний день.
- Наш урожай уже учтён в общем амбаре.
- Хороший инструмент кормит много ртов.
- Сначала семена и вода, потом пироги.
LUMBERJACK:
- Срубил дерево — посади следующее.
- Наша делянка невелика, ей нужен отдых.
- Саженцы сегодня — балки завтра.
- У каждой партии брёвен есть своя работа.
FISHER:
- Вода рядом, но улов не бесконечен.
- Исправная снасть стоит раннего подъёма.
- После ветра рыбу ищу в тихой воде.
- У причала оставляйте свободный проход.
ARTISAN:
- Без сырья печь остаётся холодной.
- Песок и топливо превращаются в стекло.
- Не всякий камень скрывает руду.
- Запасы инструмента требуют внимания.
GUARD:
- За воротами лучше держаться освещённой дороги.
- Ночью я обхожу дворы.
- Если увидите врага — прикройте работников.
- Сильная деревня начинается с живых соседей.
hunger:
- Еды не хватает. Помогите пополнить запас.
- Сегодня порции стали меньше.
construction:
- Слышите стройку? Скоро у нас будет новый дом.
shortage:
- На складе не хватает нужных припасов. Спросите торговца.
danger:
- В укрытие! Враг рядом.
friendly:
- Рады снова видеть человека дела.
hostile:
- После причинённого вреда доверие придётся вернуть.
MINER:
- Проверяем жилу перед началом выработки.
- Каменная кирка не заменяет пустую шахту.
- Песок, камень и руда имеют свой запас.
- Выработке нужны рабочие и инструмент.
STONEMASON:
- Ровная грань начинается с терпения.
- У камня тоже есть своя работа.
- Новые основания ждут нашей артели.
- Проверяю инструмент перед сменой.
SMITH:
- Без металла кузница остаётся тихой.
- Готовлю инструменты для соседей.
- Топливо берём со склада по потребности.
- Хорошая кирка продлит жизнь выработке.
BAKER:
- Для хлеба сначала нужно зерно.
- Лишний хлеб сохраняем на завтра.
- Сегодня печём по настоящей потребности.
- Пустой амбар не согреешь словами.
WATER_CARRIER:
- Проверяю, достаточно ли воды у источника.
- Каждому новому огороду нужна настоящая вода.
- Пустое ведро возвращается после полива.
- Без источника водозабор не работает.
chat_work:
- Работа идёт спокойнее, когда соседи интересуются делами.
- Расскажу, чем занимаюсь сегодня.
chat_village:
- Живём общими делами. Загляните к доске потребностей.
- Каждый новый дом должен быть обеспечен припасами.
chat_friend:
- Спасибо, что заглянули. Давайте знакомиться ближе.
- Доброе слово приятно слышать между делами.
chat_close:
- Уже узнаю вас издалека. Рад нашему разговору.
- Старому знакомому у нас всегда рады.
chat_danger:
- Сейчас опасно! Продолжим беседу в безопасности.
chat_hunger:
- Сейчас больше всего переживаю за еду для соседей.
chat_hostile:
- После причинённого вреда добрые слова должны подкрепляться делами.
CHILD:
- Когда вырасту, выберу полезное дело.
- Пока взрослые работают, я изучаю нашу деревню.
- У каждого дома здесь своя история.
- После работы приходите к нашему двору!
